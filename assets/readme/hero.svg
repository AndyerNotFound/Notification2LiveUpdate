<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Notification 2 Live Update —— 把横幅通知变成实时更新</title>
  <desc id="hero-desc">左侧是项目名称与一句话价值主张，右侧示意一条横幅通知如何被转换为带状态栏胶囊的 Live Update 卡片。</desc>

  <rect width="1200" height="380" rx="26" fill="#0E1626"/>

  <g id="title-block" transform="translate(56 0)">
    <text x="0" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="4" fill="#5EEAD4">ANDROID 16 · LIVE UPDATE</text>
    <text x="0" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="66" font-weight="700" fill="#F5F7FA">把横幅通知</text>
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="66" font-weight="700" fill="#14B8A6">变成实时更新</text>
    <rect x="2" y="260" width="248" height="6" rx="3" fill="#14B8A6"/>
    <text x="0" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" fill="#A9B8D4">任何应用的横幅 / 常驻进度通知，</text>
    <text x="0" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" fill="#A9B8D4">在状态栏变成可提升的实时更新。</text>
    <text x="0" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6F84A8">minSdk 26 · targetSdk 36 · 无网络权限 · AGPL-3.0</text>
  </g>

  <g id="proof-phone" transform="translate(700 40)">
    <rect width="444" height="300" rx="22" fill="#111B30" stroke="#1F2C4A" stroke-width="1.5"/>

    <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6F84A8">9:41</text>
    <circle cx="278" cy="24" r="3" fill="#22304F"/>
    <circle cx="290" cy="24" r="3" fill="#22304F"/>
    <circle cx="302" cy="24" r="3" fill="#22304F"/>
    <rect x="376" y="10" width="92" height="30" rx="15" fill="#14B8A6"/>
    <text x="422" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#0E1626">3 分钟</text>

    <rect x="24" y="56" width="396" height="80" rx="16" fill="#16213A" stroke="#22304F" stroke-width="1.5"/>
    <rect x="44" y="80" width="32" height="24" rx="12" fill="none" stroke="#7C90B2" stroke-width="2"/>
    <circle cx="60" cy="92" r="3.5" fill="#7C90B2"/>
    <text x="92" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#E8EEF9">美团外卖 · 正在配送中</text>
    <text x="92" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" fill="#7C90B2">横幅通知 · 骑手距您 800 米</text>
    <text x="380" y="96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#4E607F">源通知</text>

    <path d="M 222 150 L 222 176 M 216 170 L 222 182 L 228 170" stroke="#14B8A6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="24" y="188" width="396" height="92" rx="16" fill="#16213A" stroke="#14B8A6" stroke-width="1.5"/>
    <rect x="44" y="212" width="32" height="24" rx="12" fill="#14B8A6"/>
    <circle cx="60" cy="224" r="3.5" fill="#F5F7FA"/>
    <text x="92" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">外卖还有 3 分钟</text>
    <text x="92" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" fill="#8FA3C8">骑手正在路上 · 已转换 · 可提升</text>
    <rect x="92" y="266" width="232" height="8" rx="4" fill="#22304F"/>
    <rect x="92" y="266" width="146" height="8" rx="4" fill="#14B8A6"/>
    <rect x="330" y="238" width="74" height="30" rx="15" fill="#14B8A6"/>
    <text x="367" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#0E1626">3 分钟</text>
    <text x="380" y="212" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5EEAD4">LIVE UPDATE</text>
  </g>
</svg>
