name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: n2lu-debug-keystore-v1

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/Notification2LiveUpdate-${GITHUB_REF_NAME//\//-}-debug.apk"

      - name: Generate checksums
        run: sha256sum out/*.apk > out/SHA256SUMS.txt && cat out/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notification2LiveUpdate-debug
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" out/*.apk out/SHA256SUMS.txt --clobber \
            || gh release create "$GITHUB_REF_NAME" out/*.apk out/SHA256SUMS.txt \
                 --title "Notification 2 Live Update $GITHUB_REF_NAME" \
                 --generate-notes
